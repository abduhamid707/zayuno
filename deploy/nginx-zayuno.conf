server {
    listen 80;
    listen 443 ssl;
    server_name api.zayuno.uz;
    ssl_certificate /etc/letsencrypt/live/zayuno.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zayuno.uz/privkey.pem;
    client_max_body_size 50M;

    # Do not index API endpoints in search engines
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen 443 ssl;
    server_name mcp.zayuno.uz;
    ssl_certificate /etc/letsencrypt/live/zayuno.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zayuno.uz/privkey.pem;

    # Do not index MCP stream endpoints in search engines
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass http://127.0.0.1:4102;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

