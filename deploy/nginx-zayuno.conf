# Zayuno production domain separation. Only Zayuno-specific hosts belong here.

server {
    listen 80;
    server_name zayuno.uz www.zayuno.uz;
    location = /.well-known/openai-apps-challenge {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    return 301 https://zayuno.uz$request_uri;
}

# Fictional railway ticketing sandbox provider API and secure handoff demo.
server {
    listen 80;
    server_name poyez-sandbox.shopla.uz;
    return 301 https://poyez-sandbox.shopla.uz$request_uri;
}

server {
    listen 443 ssl;
    server_name poyez-sandbox.shopla.uz;
    ssl_certificate /etc/letsencrypt/live/poyez-sandbox.shopla.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poyez-sandbox.shopla.uz/privkey.pem;
    client_max_body_size 128k;
    location / {
        proxy_pass http://127.0.0.1:4106;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

server {
    listen 443 ssl;
    server_name zayuno.uz;
    ssl_certificate /etc/letsencrypt/live/zayuno.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zayuno.uz/privkey.pem;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /.well-known/openai-apps-challenge {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Assets Caching
    location /assets/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    server_name www.zayuno.uz;
    ssl_certificate /etc/letsencrypt/live/zayuno.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zayuno.uz/privkey.pem;
    return 301 https://zayuno.uz$request_uri;
}

# Internal Zayuno operations console. The container listens only on loopback;
# this is the sole public entry point and is protected by application JWT auth.
server {
    listen 80;
    server_name admin.zayuno.uz;
    return 301 https://admin.zayuno.uz$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.zayuno.uz;
    ssl_certificate /etc/letsencrypt/live/admin.zayuno.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.zayuno.uz/privkey.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:4103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

