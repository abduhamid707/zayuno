name: Deploy to Production

on:
  workflow_run:
    workflows: ["Build & Push Container Images to GHCR"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: "Git commit SHA to deploy (defaults to current workflow commit)"
        required: false
        default: ""
        type: string
      services:
        description: 'Services to recreate ("auto", space-separated, or "all")'
        required: false
        default: "auto"
        type: string
      run_migrations:
        description: 'Run database migrations ("auto", "true", or "false")'
        required: false
        default: "auto"
        type: choice
        options: [auto, "true", "false"]

concurrency:
  group: zayuno-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Production Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Validate Deploy SHA format
        id: resolve-sha
        shell: bash
        run: |
          TARGET_SHA="${{ github.event.inputs.deploy_sha }}"
          if [ -z "$TARGET_SHA" ]; then
            TARGET_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          fi

          if ! [[ "$TARGET_SHA" =~ ^[a-f0-9]{7,40}$ ]]; then
            echo "::error::Invalid Git commit SHA: $TARGET_SHA. Must be 7-40 hex characters."
            exit 1
          fi

          echo "TARGET_SHA=$TARGET_SHA" >> $GITHUB_ENV
          echo "Target Release SHA: $TARGET_SHA"

      - name: Resolve target services
        id: resolve-services
        shell: bash
        run: |
          INPUT_SERVICES="${{ github.event.inputs.services }}"
          if [ "$INPUT_SERVICES" = "all" ]; then
            RESOLVED="mock-evos mock-coffee-time mock-poyez hh-recruitment api mcp admin provider-portal worker"
          elif [ -n "$INPUT_SERVICES" ] && [ "$INPUT_SERVICES" != "auto" ]; then
            RESOLVED="$INPUT_SERVICES"
          else
            CHANGED_FILES=$(git diff --name-only "${TARGET_SHA}^" "$TARGET_SHA" || true)
            RESOLVED=""

            add_service() {
              case " $RESOLVED " in *" $1 "*) ;; *) RESOLVED="$RESOLVED $1";; esac
            }

            while IFS= read -r file; do
              case "$file" in
                integrations/mock-evos/*) add_service mock-evos ;;
                integrations/mock-coffee-time/*) add_service mock-coffee-time ;;
                integrations/mock-poyez/*) add_service mock-poyez ;;
                apps/api/*) add_service api; add_service worker ;;
                apps/mcp/*) add_service mcp ;;
                apps/admin/*) add_service admin ;;
                apps/provider-portal/*) add_service provider-portal ;;
                packages/contracts/*|packages/shared/*|packages/provider-sdk/*) add_service mock-evos; add_service mock-coffee-time; add_service mock-poyez; add_service api; add_service mcp; add_service worker ;;
                packages/database/*) add_service api; add_service worker ;;
                .github/workflows/*|deploy/*|docker-compose.prod.yml|infra/docker/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|turbo.json|tsconfig.base.json) RESOLVED="mock-evos mock-coffee-time mock-poyez hh-recruitment api mcp admin provider-portal worker" ;;
              esac
            done <<< "$CHANGED_FILES"

            # Documentation-only changes need no container restart.
            RESOLVED=$(echo "$RESOLVED" | xargs)
          fi

          if [ -z "$RESOLVED" ]; then
            echo "No runtime service changed; deployment will only sync manifests."
          fi
          echo "TARGET_SERVICES=$RESOLVED" >> $GITHUB_ENV
          echo "Target Services: $RESOLVED"

      - name: Resolve migration policy
        id: resolve-migrations
        shell: bash
        run: |
          INPUT_MIGRATIONS="${{ github.event.inputs.run_migrations }}"
          if [ "$INPUT_MIGRATIONS" = "true" ] || [ "$INPUT_MIGRATIONS" = "false" ]; then
            RESOLVED_MIGRATIONS="$INPUT_MIGRATIONS"
          else
            CHANGED_FILES=$(git diff --name-only "${TARGET_SHA}^" "$TARGET_SHA" || true)
            if echo "$CHANGED_FILES" | grep -Eq '^packages/database/(prisma/|src/seed\.ts$|.*schema\.prisma|.*migrations/)'; then
              RESOLVED_MIGRATIONS=true
            else
              RESOLVED_MIGRATIONS=false
            fi
          fi
          echo "RUN_MIGRATIONS=$RESOLVED_MIGRATIONS" >> $GITHUB_ENV
          echo "Run migrations: $RESOLVED_MIGRATIONS"

      - name: Set lowercased repo prefix for GHCR
        id: repo-prefix
        shell: bash
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/${REPO_LOWER}" >> $GITHUB_ENV

      - name: Configure SSH and Known Hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write known hosts securely
          echo "${{ secrets.PROD_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Write SSH private key securely
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_rsa_prod
          chmod 600 ~/.ssh/id_rsa_prod

      - name: Sync Deploy Manifest and Scripts to Server
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT || '22' }}
          PROD_USER: ${{ secrets.PROD_USER || 'root' }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/id_rsa_prod -p ${PROD_PORT} ${PROD_USER}@${PROD_HOST}"
          SCP_CMD="scp -i ~/.ssh/id_rsa_prod -P ${PROD_PORT}"

          echo "Running pre-flight disk cache cleanup on server..."
          $SSH_CMD "docker image prune -f >/dev/null 2>&1 || true; journalctl --vacuum-size=100M >/dev/null 2>&1 || true"

          echo "Ensuring deploy directories on server..."
          $SSH_CMD "mkdir -p /root/zayuno/deploy /root/zayuno/scripts"

          echo "Copying docker-compose.prod.yml..."
          $SCP_CMD docker-compose.prod.yml "${PROD_USER}@${PROD_HOST}:/root/zayuno/docker-compose.prod.yml"

          echo "Copying deployment scripts..."
          $SCP_CMD deploy/health-check.sh "${PROD_USER}@${PROD_HOST}:/root/zayuno/deploy/health-check.sh"
          $SCP_CMD deploy/deploy-server.sh "${PROD_USER}@${PROD_HOST}:/root/zayuno/deploy/deploy-server.sh"
          $SCP_CMD deploy/nginx-zayuno.conf "${PROD_USER}@${PROD_HOST}:/root/zayuno/deploy/nginx-zayuno.conf"
          $SCP_CMD scripts/ecosystem-server.js "${PROD_USER}@${PROD_HOST}:/root/zayuno/scripts/ecosystem-server.js"

          $SSH_CMD "chmod +x /root/zayuno/deploy/*.sh"

      - name: Execute Server-side Zero-Downtime Deployment
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT || '22' }}
          PROD_USER: ${{ secrets.PROD_USER || 'root' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/id_rsa_prod -p ${PROD_PORT} ${PROD_USER}@${PROD_HOST}"

          if [ -n "$GEMINI_API_KEY" ]; then
            echo "Syncing protected AI runtime configuration..."
            printf '%s\n' "$GEMINI_API_KEY" | $SSH_CMD 'set -eu; umask 077; IFS= read -r value; env_file=/root/zayuno/.env; tmp_file=$(mktemp /root/zayuno/.env.XXXXXX); grep -v "^GEMINI_API_KEY=" "$env_file" > "$tmp_file" || true; printf "GEMINI_API_KEY=%s\n" "$value" >> "$tmp_file"; chmod 600 "$tmp_file"; mv "$tmp_file" "$env_file"'
          fi

          echo "Triggering deployment on remote server..."
          $SSH_CMD "/root/zayuno/deploy/deploy-server.sh '${{ env.TARGET_SHA }}' '${{ env.TARGET_SERVICES }}' '${{ env.IMAGE_PREFIX }}' '${{ env.RUN_MIGRATIONS }}'"

      - name: Cleanup SSH Key
        if: always()
        shell: bash
        run: |
          rm -f ~/.ssh/id_rsa_prod

      - name: Generate Deployment Summary
        if: always()
        shell: bash
        run: |
          echo "## 🚀 Zayuno Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed SHA**: \`${{ env.TARGET_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Services Recreated**: \`${{ env.TARGET_SERVICES }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Prefix**: \`${{ env.IMAGE_PREFIX }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Migrations Executed**: \`${{ env.RUN_MIGRATIONS }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED (Check logs & rollback state)' }}" >> $GITHUB_STEP_SUMMARY
