name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Target SHA to rollback to (leave blank to use the last recorded previous SHA on server)'
        required: false
        default: ''
        type: string
      services:
        description: 'Services to rollback (space-separated or "all")'
        required: false
        default: 'all'
        type: string

concurrency:
  group: zayuno-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    name: Production Rollback
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH and Known Hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          echo "${{ secrets.PROD_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_rsa_prod
          chmod 600 ~/.ssh/id_rsa_prod

      - name: Set lowercased repo prefix for GHCR
        id: repo-prefix
        shell: bash
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/${REPO_LOWER}" >> $GITHUB_ENV

      - name: Execute Server-side Rollback
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT || '22' }}
          PROD_USER: ${{ secrets.PROD_USER || 'root' }}
          INPUT_TARGET_SHA: ${{ github.event.inputs.target_sha }}
          INPUT_SERVICES: ${{ github.event.inputs.services }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/id_rsa_prod -p ${PROD_PORT} ${PROD_USER}@${PROD_HOST}"

          SERVICES="$INPUT_SERVICES"
          if [ -z "$SERVICES" ] || [ "$SERVICES" = "all" ]; then
            SERVICES="mock-evos mock-coffee-time mock-poyez api mcp admin provider-portal worker"
          fi

          $SSH_CMD "bash -s" << EOF
            set -euo pipefail
            cd /root/zayuno

            ROLLBACK_SHA="$INPUT_TARGET_SHA"
            if [ -z "\$ROLLBACK_SHA" ]; then
              if [ -f /root/zayuno/.previous_release_sha ]; then
                ROLLBACK_SHA=\$(cat /root/zayuno/.previous_release_sha | tr -d '[:space:]')
              else
                echo "No previous release SHA recorded on server!"
                exit 1
              fi
            fi

            echo "Rolling back to SHA: \$ROLLBACK_SHA..."
            export IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}"
            export DEPLOY_SHA="\$ROLLBACK_SHA"

            # shellcheck disable=SC2086
            docker compose -f docker-compose.prod.yml up -d --no-deps $SERVICES

            # Validate health after rollback
            /root/zayuno/deploy/health-check.sh all

            echo "\$ROLLBACK_SHA" > /root/zayuno/.current_release_sha
            echo "Rollback to \$ROLLBACK_SHA completed successfully."
          EOF

      - name: Cleanup SSH Key
        if: always()
        shell: bash
        run: |
          rm -f ~/.ssh/id_rsa_prod

      - name: Rollback Summary
        if: always()
        shell: bash
        run: |
          echo "## ⚠️ Zayuno Production Rollback" >> $GITHUB_STEP_SUMMARY
          echo "- **Target SHA**: \`${{ github.event.inputs.target_sha || 'Last Known Working SHA' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status == 'success' && '✅ RESTORED' || '❌ FAILED' }}" >> $GITHUB_STEP_SUMMARY
