name: CI - Test & Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test & Monorepo Build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/zayuno?schema=public'
      JWT_SECRET: 'ci-secret-jwt-key-32-chars-long-test'
      ENCRYPTION_KEY: '01234567890123456789012345678901'
      WEBHOOK_SECRET: 'ci-secret-webhook-key'
      TELEGRAM_ALLOW_WEB_FALLBACK: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build All Monorepo Packages and Applications
        run: pnpm build

      - name: Lint and Code Consistency
        run: pnpm lint

      - name: Run All Review & Regression Tests
        run: pnpm test:review
