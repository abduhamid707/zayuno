name: CI - Test & Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test & Monorepo Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build All Monorepo Packages and Applications
        run: pnpm build

      - name: Lint and Code Consistency
        run: pnpm lint

      - name: Run Documentation Contract Test
        run: pnpm test:docs-contract

      - name: Run Action & Guardrail Tests
        run: |
          pnpm test:action-guardrails
          pnpm test:action-state-machine
          pnpm test:location-and-quote-persistence
          pnpm test:webhook-guardrails
          pnpm test:dynamic-provider-context
          pnpm test:sensitive-dynamic-parameters
          pnpm test:provider-operations
          pnpm test:mcp-tool-consistency
