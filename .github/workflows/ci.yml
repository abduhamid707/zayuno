name: CI - Test & Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test & Monorepo Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm 9.15.0
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint and Code Consistency
        run: pnpm lint

      - name: Run Documentation Contract Test
        run: pnpm test:docs-contract

      - name: Run Action & Guardrail Tests
        run: |
          pnpm test:action-guardrails
          pnpm test:action-state-machine
          pnpm test:location-and-quote-persistence
          pnpm test:webhook-guardrails
          pnpm test:dynamic-provider-context
          pnpm test:sensitive-dynamic-parameters
          pnpm test:provider-operations
          pnpm test:mcp-tool-consistency

      - name: Build All Monorepo Packages and Applications
        run: pnpm build
